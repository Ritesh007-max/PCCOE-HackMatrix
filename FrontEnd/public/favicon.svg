<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="finNavyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E234A" />
      <stop offset="45%" stop-color="#081836" />
      <stop offset="100%" stop-color="#030C1E" />
    </linearGradient>

    <!-- Luxury Gold Rim Gradient -->
    <linearGradient id="finGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#E5BE58" />
      <stop offset="50%" stop-color="#A1751F" />
      <stop offset="75%" stop-color="#F2D179" />
      <stop offset="100%" stop-color="#B38526" />
    </linearGradient>

    <!-- Saffron Gradient (Indian Flag Top Wave) -->
    <linearGradient id="finSaffronGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Emerald Green Gradient (Indian Flag Bottom Ribbon) -->
    <linearGradient id="finEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Center Arrow & F Beam: Radiant Ivory to Soft Gold -->
    <linearGradient id="finBeamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Drop Shadow for 3D Floating Depth -->
    <filter id="finDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Subtle Inner Glow -->
    <radialGradient id="finCenterGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="30" fill="url(#finNavyBg)" stroke="url(#finGoldRim)" stroke-width="4.5" />
  
  <!-- Subtle Internal Glow Layer -->
  <rect x="7" y="7" width="114" height="114" rx="28" fill="url(#finCenterGlow)" />
  <rect x="9.5" y="9.5" width="109" height="109" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <!-- Main Glyph: Forward-Surging 'F' Monogram + Growth Arrow + Tricolor Waves -->
  <g filter="url(#finDropShadow)">
    <!-- 1. Top Radiant Saffron Ribbon (Waving Flourish) -->
    <path
      d="M 33 55 C 34 44, 48 37, 62 37 C 72 37, 81 33.5, 84 31 C 80 37.5, 71 42.5, 60 42.5 C 47 42.5, 38 48, 33 55 Z"
      fill="url(#finSaffronGrad)"
    />

    <!-- 2. Lower Vibrant Emerald Ribbon (F Crossbar / Grounding Foundation) -->
    <path
      d="M 50 77 L 77 77 C 82 77, 85 80, 83 84 C 81 88, 77 90, 71 90 L 44 90 Z"
      fill="url(#finEmeraldGrad)"
    />

    <!-- 3. Dynamic Stem of 'F' (Slanted Base) -->
    <path
      d="M 29 100 L 45 61 L 58 61 L 42 100 Z"
      fill="url(#finBeamGrad)"
    />

    <!-- 4. Ascending Growth Ribbon with Upward Arrowhead (Core Monogram Beam) -->
    <path
      d="M 32 78 C 35 63, 44 49, 58 46 C 71 43, 80 39, 87 32 L 87 23 L 104 36 L 89 49 L 89 40 C 81 47, 69 52, 57 54 C 47 56, 40 66, 36 79 Z"
      fill="url(#finBeamGrad)"
    />
  </g>
</svg>
